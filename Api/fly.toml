# fly.toml app configuration file generated for api-twilight-wildflower-3499
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = "api-twilight-wildflower-3499"
primary_region = "atl"

[build]
  dockerfile = "Dockerfile"

[[mounts]]
  source = "sqldata"       
  destination = "/data"

[http_service]
  internal_port = 8080     
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
